[Settings]
; Action to run when any enabled trigger fires.
; Can be a script (.bat/.cmd/.ps1) or an executable (e.g. shutdown.exe).
; Absolute path, or relative to this config.ini directory.
ScriptPath=C:\Windows\System32\shutdown.exe
ScriptArgs=/s /t 60 /c MyTasks-auto
WorkingDirectory=

[Startup]
; After this service starts, run programs with per-task delays (Task1..Task16).
Enabled=1
; DelaySeconds is counted from service start (not from user logon).
Task1_DelaySeconds=60
Task1_Path=scripts\startup_task1.bat
Task1_Args=
Task1_WorkingDirectory=

; Example second task (disabled by leaving Path empty, or set your own):
; Task2_DelaySeconds=300
; Task2_Path=C:\Tools\something.exe
; Task2_Args=/quiet
; Task2_WorkingDirectory=

[LoginScreen]
; Run when the credential / lock UI is showing (any common path below).
Enabled=1
; Win+L / session lock.
OnLock=1
; User logoff, or shutdown that finished logging off the session.
OnLogoff=1
; Switch user / console disconnect (session remains, login UI shown).
OnDisconnect=1
; Also poll session state each CheckIntervalSeconds to catch edge cases
; (e.g. ended on login screen after a cancelled/failed shutdown).
PollDetect=1

[Idle]
; Run the action after the computer has been idle (no keyboard/mouse) for N minutes.
Enabled=1
IdleMinutes=30
; How often to poll idle/schedule (seconds). Prefer 15-60 so scheduled HH:MM is not missed.
CheckIntervalSeconds=30
; Also accumulate idle while on login/lock screen (no usable desktop).
CountLoginScreen=1

[Schedule]
; Run the action at one or more daily local times (24-hour HH:MM, comma-separated).
Enabled=0
Times=23:00
; If 1, scheduled fire only when current idle minutes >= Idle.IdleMinutes
OnlyWhenIdle=0
